headline: "Statistical foundations for reliable and accountable AI"
summary: >-
  I develop principled and scalable methods for data-centric AI, explainable AI,
  LLM evaluation, and uncertainty quantification. My work connects statistical
  theory with practical algorithms for understanding data, model behavior, and
  structured human preferences.

research_focus:
  - title: "Data-centric AI"
    description: "Measuring the value of data points, groups, and contributors while accounting for strategic behavior and real-world structure."
  - title: "Explainable AI"
    description: "Designing Shapley-based attribution methods that respect priority, precedence, and dependencies among contributors."
  - title: "LLM evaluation"
    description: "Modeling soft, cyclic, and multi-criterion preferences to evaluate modern generative AI systems more faithfully."
  - title: "Uncertainty quantification"
    description: "Building conformal prediction methods with statistical guarantees and substantially lower computational cost."

